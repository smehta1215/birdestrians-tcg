<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Birdestrians Pack Opening</title>
<meta name="description" content="A special pack of Birdestrians cards is waiting for you. Swipe to open!">
<meta property="og:title" content="Birdestrians Pack Opening">
<meta property="og:description" content="A special pack of Birdestrians cards is waiting for you. Swipe to open!">
<meta name="theme-color" content="#5b3fd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@property --c1 { syntax: '<color>'; inherits: true; initial-value: #5b3fd6; }
@property --c2 { syntax: '<color>'; inherits: true; initial-value: #c9b8ff; }
:root { --pw: 300px; --ph: 520px; --c1: #5b3fd6; --c2: #c9b8ff; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif; color: #2a2540;
  user-select: none; -webkit-user-select: none; touch-action: none;
  transition: --c1 .7s ease, --c2 .7s ease; overscroll-behavior: none;
  background: linear-gradient(162deg, var(--c2) 0%, var(--c2) 36%, #f4f3f9 36.2%, #ffffff 100%);
  background:
    radial-gradient(120% 60% at 50% 0%, color-mix(in srgb, var(--c2) 70%, white) 0%, transparent 70%),
    linear-gradient(162deg, var(--c2) 0%, color-mix(in srgb, var(--c2) 60%, white) 36%, #f4f3f9 36.2%, #ffffff 100%);
}
button { font-family: inherit; }
img { -webkit-user-drag: none; }

/* ---------- top bar ---------- */
.topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px; z-index: 50; pointer-events: none; }
.brand { pointer-events: auto; background: #ffffffcc; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-radius: 999px; padding: 6px 14px;
  font-weight: 700; letter-spacing: 2px; font-size: 13px; color: var(--c1); box-shadow: 0 2px 10px #0000001a; }
.icon-btn { pointer-events: auto; width: 40px; height: 40px; border-radius: 50%; border: 0; background: #ffffffcc;
  box-shadow: 0 2px 10px #0000001a; font-size: 18px; cursor: pointer; color: #555; display: grid; place-items: center; }

/* ---------- screens ---------- */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .45s ease; }
.screen.active { opacity: 1; pointer-events: auto; }

/* ---------- carousel ---------- */
.carousel-title { position: absolute; top: max(70px, 9vh); left: 0; right: 0; text-align: center; font-weight: 700;
  font-size: clamp(20px, 5vw, 30px); color: #fff; text-shadow: 0 2px 12px #0004; text-shadow: 0 2px 12px color-mix(in srgb, var(--c1) 70%, transparent); padding: 0 20px; }
.carousel-stage { position: relative; width: 100%; height: calc(var(--ph) * 1.25); perspective: 1100px; cursor: grab; }
.carousel-stage:active { cursor: grabbing; }
.cpack { position: absolute; left: 50%; top: 46%; width: var(--pw); height: var(--ph); will-change: transform;
  -webkit-box-reflect: below 6px linear-gradient(transparent 62%, #ffffff55); }
.cpack .float { width: 100%; height: 100%; position: relative; }
.cpack.center .float { animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px); } }
.pack-art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: fill;
  filter: drop-shadow(0 14px 22px #0000003a); }
.shine { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; opacity: .85;
  background: linear-gradient(105deg, transparent 30%, #ffffff00 38%, #ffffff66 46%, #ffffff22 50%, transparent 58%);
  background-size: 300% 100%; background-position: calc(var(--mx, .5) * 100%) 0;
  -webkit-mask: linear-gradient(#000 0 0); }
.carousel-name { margin-top: 4px; font-weight: 700; font-size: 20px; color: #2a2540; min-height: 28px; }
.btn { border: 0; border-radius: 999px; padding: 14px 58px; font-size: 20px; font-weight: 700; cursor: pointer;
  color: #0d5c4e; background: linear-gradient(180deg, #8ff5d8, #4fe0bd); box-shadow: 0 6px 0 #2fb898, 0 10px 24px #2fb89855;
  transition: transform .1s; }
.btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #2fb898; }
.btn.ghost { white-space: nowrap; background: #fff; color: #555; box-shadow: 0 4px 0 #d6d3e2, 0 8px 18px #0000001a; padding: 12px 26px; font-size: 16px; }
.dots { display: flex; gap: 8px; margin-top: 18px; }
.dots span { width: 8px; height: 8px; border-radius: 50%; background: #c9c4dc; transition: all .3s; }
.dots span.on { background: var(--c1); width: 22px; border-radius: 4px; }
.bottom-row { position: absolute; bottom: max(22px, 3vh); display: flex; flex-direction: column; align-items: center; }

/* ---------- opening ---------- */
.open-wrap { position: relative; width: var(--pw); height: var(--ph); perspective: 1000px; }
.pack-area { position: absolute; inset: 0; }
.pack { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
.layer { position: absolute; inset: 0; will-change: clip-path, transform; }
.layer .pack-art { filter: none; }
.pack-shadow { position: absolute; inset: 4% 3% 0; border-radius: 6px; box-shadow: 0 24px 40px #00000040; }
.tearsvg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.tearsvg path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tip { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; pointer-events: none; opacity: 0;
  background: radial-gradient(circle, #fff 0 6%, #fffbe0dd 12%, #ffe9887a 26%, #ffd34f22 45%, transparent 66%);
  mix-blend-mode: screen; transition: opacity .2s; }
.tip::after { content: ''; position: absolute; left: 50%; top: 50%; width: 180px; height: 6px; margin: -3px 0 0 -90px;
  background: radial-gradient(closest-side, #fff, #fff6 50%, transparent); }
.guide { position: absolute; left: -4%; right: -4%; height: 4px; margin-top: -2px; pointer-events: none; transition: opacity .3s; }
.guide::before { content: ''; position: absolute; inset: 0; border-top: 2px dashed #ffffffcc; top: 1px; filter: drop-shadow(0 0 3px #fff); }
.guide::after { content: ''; position: absolute; top: -10px; width: 24px; height: 24px; border-radius: 50%;
  background: radial-gradient(circle, #fff, #fff8 40%, transparent 70%); animation: sweep 1.8s ease-in-out infinite; }
@keyframes sweep { 0% { left: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { left: calc(100% - 24px); opacity: 0; } }
.finger { position: absolute; font-size: 34px; pointer-events: none; animation: finger 1.8s ease-in-out infinite; transition: opacity .3s;
  filter: drop-shadow(0 3px 6px #0004); }
@keyframes finger { 0% { left: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { left: 92%; opacity: 0; } }
.hint { margin-top: 26px; font-weight: 600; font-size: 17px; color: #4a4560; text-align: center; min-height: 24px; padding: 0 20px; transition: opacity .3s; }
.hint.nudge { animation: nudge .4s; }
@keyframes nudge { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.back-btn { position: absolute; left: 16px; bottom: max(22px, 3vh); }

/* ---------- cards ---------- */
.stack { position: absolute; left: 50%; top: calc(var(--ph) * .22); width: calc(var(--pw) * .86); height: calc(var(--pw) * .86 * 1.4);
  transform: translateX(-50%) translateY(var(--sy, 0px)) scale(var(--ss, 1)); transition: transform .7s cubic-bezier(.2,.8,.2,1); }
.card { position: absolute; inset: 0; perspective: 900px;
  transition: transform .55s cubic-bezier(.22,.9,.3,1.12), opacity .45s ease, filter .5s ease; }
.card.arrive .card-tilt { animation: arrive .6s cubic-bezier(.25,.9,.3,1.2); }
@keyframes arrive { 0% { scale: .95; } 55% { scale: 1.025; } 100% { scale: 1; } }
.face.front::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(105deg, transparent 42%, #ffffff66 50%, transparent 58%); background-size: 260% 100%; mix-blend-mode: screen; }
.card.arrive .face.front::after { animation: sweep-shine .9s .12s ease-out; }
@keyframes sweep-shine { 0% { opacity: 1; background-position: 100% 0; } 100% { opacity: 1; background-position: -60% 0; } }
.counter b, .counter span { display: inline-block; transition: transform .25s, opacity .25s; }
.counter.bump b { transform: scale(1.15); }
.card-tilt { position: absolute; inset: 0; transform-style: preserve-3d;
  transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); }
.card-flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 1s cubic-bezier(.3,1.4,.4,1); }
.card.facedown .card-flip { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 5.3% / 3.8%; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 10px 26px #00000038; background: #ddd; }
.face img, .face svg { width: 100%; height: 100%; display: block; object-fit: cover; }
.face.back { transform: rotateY(180deg); }
.holo { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: .24; filter: saturate(1.2);
  background: repeating-linear-gradient(115deg, #ff6fc8 0%, #ffd36e 7%, #6dffc4 14%, #5cc7ff 21%, #b98bff 28%, #ff6fc8 35%);
  background-size: 400% 400%; background-position: calc(var(--px, .5) * 100%) calc(var(--py, .5) * 100%); }
.holo::after { content: ''; position: absolute; inset: 0; opacity: .5; mix-blend-mode: overlay;
  background-image: radial-gradient(circle, #fff 0 1px, transparent 1.6px), radial-gradient(circle, #fff 0 .8px, transparent 1.4px);
  background-size: 17px 17px, 11px 11px; background-position: 0 0, 5px 7px; }
.glare { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay;
  background: radial-gradient(farthest-corner circle at calc(var(--px, .5) * 100%) calc(var(--py, .3) * 100%),
    #ffffffbb 0%, #ffffff33 22%, #00000022 90%); }
.card.gift-ready .card-tilt { animation: giftglow 1.4s ease-in-out infinite; border-radius: 5.3% / 3.8%; }
@keyframes giftglow { 0%,100% { filter: drop-shadow(0 0 10px #ffd34fbb) drop-shadow(0 0 24px #ff6fc855); }
  50% { filter: drop-shadow(0 0 22px #ffd34f) drop-shadow(0 0 46px #ff6fc8aa); } }
.card.charging .card-tilt { animation: charge .7s ease-in forwards; }
@keyframes charge { 0% { transform: scale(1); } 60% { transform: scale(.94) rotate(-2deg); } 80% { transform: scale(.96) rotate(2deg); }
  100% { transform: scale(1.04); filter: drop-shadow(0 0 40px #fff) brightness(1.3); } }
.rays { position: absolute; left: 50%; top: 50%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; pointer-events: none;
  opacity: 0; transition: opacity 1s; z-index: -1;
  background: repeating-conic-gradient(from 0deg, #ffffff00 0deg 9deg, #fff4c860 9deg 18deg);
  -webkit-mask: radial-gradient(closest-side, #000 0%, transparent 60%); mask: radial-gradient(closest-side, #000 0%, transparent 60%);
  animation: spin 30s linear infinite; }
.rays.on { opacity: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
.banner { position: absolute; top: max(64px, 8vh); left: 0; right: 0; text-align: center; font-weight: 700; font-size: clamp(30px, 8vw, 54px);
  color: #fff; text-shadow: 0 3px 0 #ff5c93, 0 6px 22px #ff5c9380; opacity: 0; transform: scale(.6); pointer-events: none;
  transition: opacity .5s, transform .6s cubic-bezier(.3,1.6,.5,1); z-index: 20; }
.banner.on { opacity: 1; transform: scale(1); }
.counter { position: absolute; bottom: max(26px, 4vh); left: 0; right: 0; text-align: center; font-weight: 600; color: #4a4560;
  opacity: 0; transition: opacity .4s; }
.counter.on { opacity: 1; }
.counter b { display: inline-block; background: #fff; border-radius: 999px; padding: 4px 14px; margin-bottom: 8px; box-shadow: 0 2px 10px #0001; }

/* ---------- summary ---------- */
#summary { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; padding: 80px 16px 120px; }
#summary h2 { margin: 0 0 4px; font-size: 28px; color: #fff; text-shadow: 0 2px 12px #0004; text-shadow: 0 2px 12px color-mix(in srgb, var(--c1) 70%, transparent); }
#summary p { margin: 0 0 18px; color: #fff; opacity: .9; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(140px, 28vw), 1fr)); gap: 14px; width: min(860px, 100%); }
.grid .thumb { position: relative; aspect-ratio: 5 / 7; cursor: pointer; transition: transform .2s; animation: pop .5s backwards; }
.grid .thumb:hover { transform: translateY(-4px) scale(1.03); }
@keyframes pop { from { opacity: 0; transform: translateY(20px) scale(.9); } }
.grid .card { position: absolute; inset: 0; }
.summary-actions { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 12px; justify-content: center; padding: 16px 16px max(18px, 3vh);
  background: linear-gradient(transparent, #ffffffee 40%); }
.zoom { position: fixed; inset: 0; background: #14102acc; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); z-index: 60; display: grid; place-items: center;
  opacity: 0; pointer-events: none; transition: opacity .3s; }
.zoom.on { opacity: 1; pointer-events: auto; }
.zoom .zc { position: relative; width: min(82vw, 62vh * .714); aspect-ratio: 5 / 7; }

#fx { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
.empty { max-width: 360px; text-align: center; background: #fff; padding: 22px; border-radius: 16px; box-shadow: 0 10px 30px #0002; }
code { background: #f0eef7; padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<div class="topbar"><div class="brand" id="brand">BIRDESTRIANS</div><button class="icon-btn" id="mute" aria-label="Toggle sound">🔊</button></div>

<section class="screen active" id="carousel">
  <div class="carousel-title" id="ctitle"></div>
  <div class="carousel-stage" id="stage"></div>
  <div class="bottom-row">
    <div class="carousel-name" id="cname"></div>
    <div style="height:14px"></div>
    <button class="btn" id="openBtn">Open</button>
    <div class="dots" id="dots"></div>
  </div>
</section>

<section class="screen" id="opening">
  <div class="rays" id="rays"></div>
  <div class="banner" id="banner"></div>
  <div class="open-wrap" id="openWrap"></div>
  <div class="hint" id="hint"></div>
  <div class="counter" id="counter"></div>
  <button class="btn ghost back-btn" id="backBtn">‹ Packs</button>
</section>

<section class="screen" id="summary">
  <h2>Your pack</h2>
  <p id="sumsub"></p>
  <div class="grid" id="grid"></div>
  <div class="summary-actions">
    <button class="btn ghost" id="replayBtn">Watch again</button>
    <button class="btn" id="againBtn" style="padding:12px 30px;font-size:17px">Open another pack</button>
  </div>
</section>

<div class="zoom" id="zoom"><div class="zc" id="zc"></div></div>
<canvas id="fx"></canvas>

<script src="config.js"></script>
<script src="cards/cards.js"></script>
<script>
(() => {
'use strict';
// ======================================================================= setup
const CFG = Object.assign({ title: 'Birdestrians', message: '', giftMessage: 'Happy Birthday!', packs: [],
  packAspect: 600 / 1040, tearLine: 0.158 }, window.BIRDESTRIANS_CONFIG || {});
if (!CFG.packs.length) CFG.packs = [{ name: 'Booster Pack', image: '', colors: ['#5b3fd6', '#c9b8ff'] }];
const CARDS = (window.BIRDESTRIANS_CARDS || []).slice().sort((a, b) => (a.gift ? 1 : 0) - (b.gift ? 1 : 0));
const $ = s => document.querySelector(s);
const root = document.documentElement;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const wait = ms => new Promise(r => setTimeout(r, ms));
const now = () => performance.now();
let PW = 300, PH = 520, state = 'carousel';

function measure() {
  const vw = innerWidth, vh = innerHeight;
  PH = Math.min(vh * 0.56, 620); PW = PH * CFG.packAspect;
  if (PW > vw * 0.6) { PW = vw * 0.6; PH = PW / CFG.packAspect; }
  root.style.setProperty('--pw', PW + 'px'); root.style.setProperty('--ph', PH + 'px');
}
measure();
$('#brand').textContent = (CFG.title || 'Birdestrians').toUpperCase();
$('#ctitle').textContent = CFG.message || '';
CARDS.forEach(c => { const i = new Image(); i.src = c.file; });

// ======================================================================= sound
const Sound = {
  ctx: null, muted: false, noise: null, tear: null,
  init() {
    if (this.ctx) { if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {}); return; }
    try {
      // Safari 16.4+: play like a media app, so sound works even with the iPhone's silent switch on
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const len = this.ctx.sampleRate * 2, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = buf;
      this.master = this.ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  ok() { return this.ctx && !this.muted; },
  // Phones only allow audio to start inside a finished tap (touchend / pointerup / click), not on
  // touch-down, so we (re)unlock on those events and play a silent sample to wake the audio output.
  unlock() {
    this.init(); if (!this.ctx) return;
    if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
    if (!this.unlocked) { try { const b = this.ctx.createBuffer(1, 1, 22050), s = this.ctx.createBufferSource();
      s.buffer = b; s.connect(this.ctx.destination); s.start(0); this.unlocked = true; } catch (e) {} }
  },
  // carousel: a card-flick "thwip" each time a pack passes the centre
  shuffle(speed = 0.5) {
    const v = clamp(0.5 + speed * 0.35, 0.5, 1);
    this.noiseHit('bandpass', 2600, 900, 0.09, 0.42 * v, 1.4);
    this.noiseHit('highpass', 5000, 3000, 0.035, 0.12 * v, 0.7);
    this.tone(230, 0, 0.06, 0.1 * v, 'sine', 120);
  },
  // carousel: soft air "swish" while the packs are being dragged, louder when faster
  swishStart() {
    if (!this.ok() || this.swish) return;
    const c = this.ctx, s = this.src(), f = c.createBiquadFilter(), g = c.createGain();
    f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.6; g.gain.value = 0;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(0, Math.random()); this.swish = { s, f, g };
  },
  swishUpdate(speed) {
    if (!this.swish) return; const t = this.ctx.currentTime;
    this.swish.g.gain.setTargetAtTime(clamp(speed * 0.18, 0, 0.22), t, 0.04);
    this.swish.f.frequency.setTargetAtTime(700 + clamp(speed, 0, 3) * 500, t, 0.05);
  },
  swishStop() {
    if (!this.swish) return; const { s, g } = this.swish, t = this.ctx.currentTime;
    g.gain.setTargetAtTime(0, t, 0.06); s.stop(t + 0.4); this.swish = null;
  },
  src() { const s = this.ctx.createBufferSource(); s.buffer = this.noise; s.loop = true; return s; },
  env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); },
  tearStart() {
    if (!this.ok() || this.tear) return;
    const c = this.ctx, s = this.src(), f = c.createBiquadFilter(), h = c.createBiquadFilter(), g = c.createGain();
    f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 0.7; h.type = 'highpass'; h.frequency.value = 700; g.gain.value = 0;
    s.connect(f); f.connect(h); h.connect(g); g.connect(this.master); s.start(0, Math.random());
    this.tear = { s, f, g };
  },
  tearUpdate(speed) {
    if (!this.tear) return;
    const t = this.ctx.currentTime, v = clamp(speed * 0.55, 0, 0.75) * (0.35 + Math.random() * 0.9);
    this.tear.g.gain.setTargetAtTime(v, t, 0.015);
    this.tear.f.frequency.setTargetAtTime(1600 + Math.random() * 3200, t, 0.01);
  },
  tearStop() {
    if (!this.tear) return; const { s, g } = this.tear, t = this.ctx.currentTime;
    g.gain.setTargetAtTime(0, t, 0.03); s.stop(t + 0.2); this.tear = null;
  },
  noiseHit(type, f0, f1, dur, peak, q = 1) {
    if (!this.ok()) return; const c = this.ctx, t = c.currentTime, s = this.src(), f = c.createBiquadFilter(), g = c.createGain();
    f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    this.env(g, t, 0.01, peak, dur); s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  },
  tone(freq, t0, dur, peak, type = 'sine', f1) {
    if (!this.ok()) return; const c = this.ctx, t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    this.env(g, t, 0.01, peak, dur); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  pop() { this.noiseHit('lowpass', 5000, 300, 0.35, 0.6); this.tone(150, 0, 0.25, 0.35, 'sine', 50); },
  whoosh() { this.noiseHit('bandpass', 500, 2600, 0.28, 0.35, 0.8); },
  slide() { this.noiseHit('lowpass', 900, 2200, 0.5, 0.18); },
  tick() { this.tone(1400, 0, 0.04, 0.06, 'triangle'); },
  charge() { this.tone(260, 0, 0.75, 0.12, 'sawtooth', 880); this.noiseHit('bandpass', 400, 4000, 0.75, 0.1, 2); },
  chime() { [1046.5, 1318.5, 1568, 2093, 2637].forEach((f, i) => { this.tone(f, i * 0.08, 0.9, 0.16); this.tone(f * 2, i * 0.08, 0.4, 0.04); }); },
};
$('#mute').addEventListener('click', () => {

  P.flap.animate([
    { transform: base, opacity: 1 },
    { transform: `${base} translate(${d * 30}px, ${-PH * 0.12}px) rotate(${-d * 18}deg)`, opacity: 1, offset: .3 },
    { transform: `${base} translate(${d * PW * 0.9}px, ${PH * 0.9}px) rotate(${-d * 80}deg)`, opacity: 0 }],
    { duration: 1100, easing: 'cubic-bezier(.35,.1,.6,1)', fill: 'forwards' });
  $('#tearsvg').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' });
  P.body.animate([{ transform: 'none' }, { transform: 'translateY(6px) scaleY(.985)' }, { transform: 'none' }], { duration: 300, easing: 'ease-out' });
  await wait(420);
  // cards peek out of the pack
  Sound.slide();
  P.stack.style.setProperty('--sy', -PH * 0.42 + 'px');
  await wait(750);
  // pack drops away
  P.pack.animate([{ transform: 'none' }, { transform: `translateY(${innerHeight}px) rotate(${d * 4}deg)` }],
    { duration: 750, easing: 'cubic-bezier(.55,0,.8,.3)', fill: 'forwards' });
  await wait(200);
  P.stack.style.setProperty('--sy', -PH * 0.0675 + 'px');
  P.stack.style.setProperty('--ss', '1.1');
  await wait(650);
  P.stack.style.zIndex = 5; P.pack.style.display = 'none';
  state = 'cards'; updateCounter();
}

// ======================================================================= card viewer
let cardEls = [], cur = 0, cardDrag = null, giftRevealed = false;
function buildStack() {
  P.stack.innerHTML = ''; cur = 0; giftRevealed = false;
  cardEls = CARDS.map(c => { const el = buildCard(c, !!c.gift); if (c.gift) el.classList.add('is-gift'); P.stack.appendChild(el); return el; });
  layoutStack();
}
function layoutStack() {
  cardEls.forEach((el, i) => {
    const k = i - cur;
    if (k < 0) return; // already-dismissed cards finish their own fly-off animation
    const kk = Math.min(k, 3); el.style.zIndex = 100 - k;
    // cards further back sit lower, smaller and a little darker, so the next one visibly "steps up"
    el.style.transform = `translateY(${kk * 9}px) scale(${1 - kk * 0.045})`;
    el.style.filter = k === 0 ? 'none' : `brightness(${1 - kk * 0.13})`;
    el.style.opacity = k > 3 ? 0 : 1;
    el.classList.toggle('gift-ready', k === 0 && el.classList.contains('is-gift') && !giftRevealed);
  });
}
function updateCounter() {
  const el = $('#counter'); if (cur >= CARDS.length) { el.classList.remove('on'); return; }
  const c = CARDS[cur];
  const msg = c.gift && !giftRevealed ? 'Something special… tap to reveal ✨'
    : cur === CARDS.length - 1 ? 'Swipe to see your whole pack' : 'Swipe or tap for the next card';
  el.innerHTML = `<b>${cur + 1} / ${CARDS.length}</b><br>${msg}`; el.classList.add('on');
}
opening.addEventListener('pointerdown', e => {
  if (state !== 'cards') return; const el = cardEls[cur]; if (!el) return;
  Sound.init();
  cardDrag = { x: e.clientX, y: e.clientY, t: now(), lx: e.clientX, lt: now(), v: 0, el };
  el.style.transition = 'none';
  opening.setPointerCapture(e.pointerId);
});
opening.addEventListener('pointermove', e => {
  if (state === 'cards' && !cardDrag) {
    const el = cardEls[cur]; if (!el) return; const r = el.getBoundingClientRect();
    const ix = (e.clientX - r.left) / r.width, iy = (e.clientY - r.top) / r.height;
    if (ix >= 0 && ix <= 1 && iy >= 0 && iy <= 1 && e.pointerType === 'mouse') { tilt.hoverCard = now(); setCardLight(el, ix, iy); }
    return;
  }
  if (!cardDrag) return;
  const dx = e.clientX - cardDrag.x, dy = e.clientY - cardDrag.y, t = now();
  cardDrag.v = (e.clientX - cardDrag.lx) / Math.max(1, t - cardDrag.lt); cardDrag.lx = e.clientX; cardDrag.lt = t;
  const el = cardDrag.el;
  if (el.classList.contains('is-gift') && !giftRevealed) return;
  el.style.transform = `translate(${dx}px, ${dy * 0.3}px) rotate(${dx * 0.05}deg)`;
  tilt.hoverCard = now();
  setCardLight(el, clamp(.5 + dx / (PW * 1.4), 0, 1), clamp(.4 + dy / (PH * 1.2), 0, 1), .5);
});
const endCard = e => {
  if (!cardDrag) return; const d = cardDrag; cardDrag = null;
  const dx = e.clientX - d.x, dy = e.clientY - d.y;
  d.el.style.transition = '';
  if (Math.hypot(dx, dy) < 8 && now() - d.t < 400) return tapCard();
  if (Math.abs(dx) > PW * 0.3 || Math.abs(d.v) > 0.55) return fling(Math.sign(dx || d.v));
  layoutStack();
};
opening.addEventListener('pointerup', endCard);
opening.addEventListener('pointercancel', endCard);

function tapCard() {
  if (state !== 'cards') return; const el = cardEls[cur]; if (!el) return;
  if (el.classList.contains('is-gift') && !giftRevealed) return revealGift(el);
  fling(-1);
}
function fling(dir) {
  const el = cardEls[cur]; if (!el) return;
  if (el.classList.contains('is-gift') && !giftRevealed) { layoutStack(); return revealGift(el); }
  Sound.whoosh();
  // fly off from wherever the card currently is (mid-drag or resting) along a gentle arc
  const from = getComputedStyle(el).transform, W = innerWidth;
  el.style.transition = 'none'; el.style.zIndex = 200; el.classList.remove('arrive');
  const anim = el.animate([
    { transform: from === 'none' ? 'translate(0,0)' : from, opacity: 1 },
    { transform: `translate(${dir * W * 0.22}px, -26px) rotate(${dir * 7}deg) scale(1.02)`, opacity: 1, offset: 0.3 },
    { transform: `translate(${dir * W * 1.05}px, 50px) rotate(${dir * 26}deg) scale(.96)`, opacity: 0 }
  ], { duration: 560, easing: 'cubic-bezier(.35,.05,.45,1)', fill: 'forwards' });
  anim.onfinish = () => { el.style.display = 'none'; };
  cur++;
  // the next card steps forward just after this one starts to leave
  setTimeout(() => {
    layoutStack();
    const next = cardEls[cur];
    if (next) { next.classList.remove('arrive'); void next.offsetWidth; next.classList.add('arrive'); }
    updateCounter();
    const c = $('#counter'); c.classList.add('bump'); setTimeout(() => c.classList.remove('bump'), 220);
  }, 110);
  if (cur >= cardEls.length) setTimeout(showSummary, 650);
}
async function revealGift(el) {
  state = 'revealing'; giftRevealed = true; updateCounterText('');
  el.classList.remove('gift-ready'); el.classList.add('charging');
  Sound.charge(); buzz([10, 40, 10, 40, 20]);
  await wait(700);
  el.classList.remove('charging');
  el.classList.remove('facedown');
  $('#rays').classList.add('on');
  await wait(380);
  const r = el.getBoundingClientRect();
  fx.confetti(r.left + r.width / 2, r.top + r.height * 0.35, 180);
  fx.burst(r.left + r.width / 2, r.top + r.height / 2, 50);
  Sound.chime(); buzz(40);
  const b = $('#banner'); b.textContent = CFG.giftMessage || ''; b.classList.add('on');
  await wait(900);
  state = 'cards'; updateCounter();
}
function updateCounterText(t) { $('#counter').classList.toggle('on', !!t); }

// ======================================================================= summary
let zoomEl = null;
function showSummary() {
  state = 'summary';
  const g = $('#grid'); g.innerHTML = '';
  $('#sumsub').textContent = `${CARDS.length} card${CARDS.length === 1 ? '' : 's'} · tap one to take a closer look`;
  CARDS.forEach((c, i) => {
    const th = document.createElement('div'); th.className = 'thumb'; th.style.animationDelay = i * 60 + 'ms';
    const el = buildCard(c, false); th.appendChild(el); g.appendChild(th);
    th.addEventListener('pointermove', e => { const r = th.getBoundingClientRect();
      setCardLight(el, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, .8); });
    th.addEventListener('pointerleave', () => setCardLight(el, .5, .4, 0));
    th.addEventListener('click', () => openZoom(c));
  });
  $('#banner').classList.remove('on'); $('#rays').classList.remove('on');
  show('summary'); $('#summary').scrollTop = 0;
}
function openZoom(c) {
  const zc = $('#zc'); zc.innerHTML = ''; zoomEl = buildCard(c, false); zc.appendChild(zoomEl);
  $('#zoom').classList.add('on'); Sound.whoosh();
}
$('#zoom').addEventListener('pointermove', e => {
  if (!zoomEl) return; const r = zoomEl.getBoundingClientRect(); tilt.hoverCard = now();
  setCardLight(zoomEl, clamp((e.clientX - r.left) / r.width, 0, 1), clamp((e.clientY - r.top) / r.height, 0, 1));
});
$('#zoom').addEventListener('click', () => { $('#zoom').classList.remove('on'); zoomEl = null; });
$('#againBtn').addEventListener('click', () => { state = 'carousel'; show('carousel'); layoutCarousel(); });
$('#replayBtn').addEventListener('click', () => {
  state = 'carousel'; show('carousel'); setTimeout(selectPack, 350);
});

// ======================================================================= misc
addEventListener('resize', () => {
  measure(); fx.resize(); layoutCarousel();
  if (tear && P.flap && !tear.done) renderTear();
});
layoutCarousel();
// Read-only debug hook used for automated testing.
window.__bird = { get state() { return state; }, get tear() { return tear; } };
})();
</script>
</body>
