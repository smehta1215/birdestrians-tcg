<text x="62" y="704" font-family="'Arial Rounded MT Bold','Trebuchet MS',Verdana,Arial,sans-serif" font-size="24" font-weight="500" fill="#1d1d2b" >Look at the top card of your deck. If it's</text><text x="62" y="736" font-family="'Arial Rounded MT Bold','Trebuchet MS',Verdana,Arial,sans-serif" font-size="24" font-weight="500" fill="#1d1d2b" >a snack, keep it. You deserve it.</text>
