<text x="62" y="922" font-family="'Arial Rounded MT Bold','Trebuchet MS',Verdana,Arial,sans-serif" font-size="22" font-weight="500" fill="#3a3a4a" font-style="italic">It has never once used the crosswalk</text><text x="62" y="952" font-family="'Arial Rounded MT Bold','Trebuchet MS',Verdana,Arial,sans-serif" font-size="22" font-weight="500" fill="#3a3a4a" font-style="italic">button, but it presses it anyway.</text>
