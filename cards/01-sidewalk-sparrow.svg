<text x="62" y="844" font-family="'Arial Rounded MT Bold','Trebuchet MS',Verdana,Arial,sans-serif" font-size="24" font-weight="500" fill="#1d1d2b" >Flip 3 coins. This attack does 10 more</text><text x="62" y="876" font-family="'Arial Rounded MT Bold','Trebuchet MS',Verdana,Arial,sans-serif" font-size="24" font-weight="500" fill="#1d1d2b" >damage for each heads.</text>
